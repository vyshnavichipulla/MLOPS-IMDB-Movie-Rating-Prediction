name: Lab 9 - IMDb Failure and Recovery

on:
  workflow_dispatch:

jobs:
  failure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run failure and recovery test
        run: python src/failure_injection.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imdb-lab9-results
          path: |
            models/**
            outputs/**
          if-no-files-found: ignore
